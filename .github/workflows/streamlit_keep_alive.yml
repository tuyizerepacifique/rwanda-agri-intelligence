name: Keep Streamlit App Awake

on:
  schedule:
    
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install streamlit-wakeup
        run: pip install streamlit-wakeup

      - name: Wake up application
        run: |
          # Your actual Streamlit App URL
          streamlit-wakeup "https://rwanda-agri-intelligence-gnnm2zjry4phmhv9mgr85m.streamlit.app/"